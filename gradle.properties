pluginId=pano-boilerplate-plugin
pluginName=Pano Plugin Boilerplate
pluginDescription=Boilerplate to create a plugin for Pano.
pluginPanoVersion=local-build
pluginClass=com.panomc.plugins.boilerplate.BoilerplatePlugin
pluginDeveloper=Pano
pluginLicense=MIT
pluginSourceUrl=https://github.com/panomc/pano-boilerplate-plugin
pluginDependencies=
pluginRequires=

# --- Freemium ------------------------------------------------------------------------
# Set to true to ship a freemium plugin: it installs and runs for free, and gates optional
# paid features on a tier bought from the store (Pro, Ultra …):
#
#   if (hasTier("pro")) { enableProFeature() }
#
# The panel then shows a Freemium badge and embeds the store's package view on the addon
# detail page. Tiers are published by the store, not declared here.
#
# Mutually exclusive with the premium licensing below — a freemium plugin that calls
# requireLicense() fails startup on purpose.
pluginFreemium=false

# --- Premium plugin licensing ---------------------------------------------------------
# This template is FREE by default. To ship a premium plugin, build with one of:
#   ./gradlew build -PlicenseServer=dev
#   ./gradlew build -PlicenseServer=prod
#   ./gradlew build -PlicenseServer=https://my.host
#   ./gradlew build -PpanoLicensePublicKey=<base64>
# Or set env vars (same semantics as pano-web-platform premium plugins / CI):
#   PANO_LICENSE_SERVER=dev|prod or full URL
#   PANO_LICENSE_PUBLIC_KEY=<base64|PEM>
# Without any of these, the embedded public key is empty and
# PluginLicenseClient.requireValidLicense() is a no-op.
# The resourceId on panomc.com store is the same as pluginId (above).
# Premium forks: in GitHub Actions you can set PANO_LICENSE_SERVER on the Gradle build
# step (e.g. dev on `dev` branch, prod on `main`) — do not enable that for this free
# template repo unless you intend releases to require a license.

pf4jVersion=3.11.1
vertxVersion=4.5.7
gsonVersion=2.11.0
handlebarsVersion=4.4.0
springContextVersion=5.3.39
organization=panomc